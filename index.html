<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="calculate your cgpa with ease.">
  <title>CGPA Calculator</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <section class="cgpa-container">
    <span id="cgpa-label">CGPA</span>
    <span id="cgpa"></span>
  </section>

  <div class="semester-toggle">
    <input type="radio" name="semester" id="first" value="first" checked>
    <label for="first">First Semester</label>

    <input type="radio" name="semester" id="second" value="second">
    <label for="second">Second Semester</label>
  </div>

  <section class="container">
    <h5>Enter Courses</h5>
    <form id="course-input-form" class="course-input-form">
      <input type="text" class="course-code-input" id="js-course-code" placeholder="course code">
      <input type="number" class="unit-input" id="js-unit" placeholder="unit" min="1" max="6">
      <select name="" id="js-grade" class="grade-input">
        <option value="" disabled selected>Grade</option>
        <option value="A">A</option>
        <option value="B">B</option>
        <option value="C">C</option>
        <option value="D">D</option>
        <option value="E">E</option>
        <option value="F">F</option>
      </select>
    </form>
    
    <div class="action-elements">
      <button type="button" class="add-button" id="js-add-button">
        + Add course
      </button>
      <div class="pop-up-message js-message"></div>
    </div>

    <hr>
    <h5>Course List</h5>
    <button id="semester-gpa"></button>
    <section class="list">
      <div class="course-header">
        <span>#</span>
        <span>Course code</span>
        <span>Unit</span>
        <span>Grade</span>
        <span>Action</span>
      </div>

      <div class="course-display-container js-course-display-container">
      </div>
    </section>
  </section>

  <script type="module" src="scripts/main.js"></script>
</body>
</html>
