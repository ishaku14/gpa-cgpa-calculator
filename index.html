<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="calculate your cgpa with ease.">
  <title>CGPA calculate</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h2>CGPA Calculator</h2>
  <div class="level-setup">
    <div class="form-group">
      <label for="level-input">Select Your Level:</label>
      <select id="level-input">
        <option value="" selected disabled>---select level---</option>
        <option value="100">100</option>
        <option value="200">200</option>
        <option value="300">300</option>
        <option value="400">400</option>
        <option value="500">500</option>
        <option value="600">600</option>
      </select>
      <div id="level-warning">
        Please select your level to continue!
      </div>
    </div>

    <div class="form-group hidden" id="previous-cgpa-group">
      <label for="previous-cgpa">Enter Your Previous CGPA:</label>
      <input name="prev-cgpa" type="number" id="previous-cgpa" class="previous-cgpa-input" placeholder="e.g., 4.25" min="0" max="5" step="0.01">
       <div id="prev-cgpa-warning">Please Enter your previous CGPA to continue!</div>
    </div>
  </div>

  <div class="container">
    <form name="course-input-form" class="course-input-form">
      <input type="text" class="course-code-input" id="js-course-code" placeholder="course code">
      <input type="number" class="unit-input" id="js-unit" placeholder="unit" min="1" max="6">
      <select name="" id="js-grade" class="grade-input">
        <option value="" disabled selected>Grade</option>
        <option value="A">A</option>
        <option value="B">B</option>
        <option value="C">C</option>
        <option value="D">D</option>
        <option value="E">E</option>
        <option value="F">F</option>
      </select>
    </form>
    
    <select id="js-semester-select" class="semester-dropdown">
      <option value="" disabled >select semester</option>
      <option value="first" selected>First semester</option>
      <option value="second">Second semester</option>
    </select>
    
    <div class="action-elements">
      <button type="button" class="add-button" id="js-add-button">
        + Add course
      </button>
      <div class="pop-up-message js-message"></div>
      
      <button class="calculate-button gpa-calculate-button" id="js-calculate" aria-label="calculate GPA">
        calculate GPA
      </button>
      
      <button class="calculate-cgpa" id="cgpa-button" aria-label="Calculate CGPA">
        calculate CGPA
      </button>
    </div>
  </div>

  <div class="results-card">
    <h3>Result</h3>
    <div class="result-row">
      <span>First Semester GPA:</span>
      <strong id="sem1-gpa"></strong>
    </div>
    
    <div class="result-row">
      <span>Second Semester GPA:</span>
      <strong id="sem2-gpa"></strong>
    </div>
    <hr>
    
    <div class="result-row total">
      <span>CGPA:</span>
      <strong id="result-cgpa"></strong>
    </div>
  </div>

  <div class="course-container">
    <div class="semester-toggle">
      <button class="first-semester-courses">First Semester</button>
      <button class="second-semester-courses">Second Semester</button>
    </div>
    
    <div class="course-display-container js-course-display-container"></div>
  </div>

  <script type="module" src="scripts/main.js"></script>
</body>
</html>
